<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catch the Coin</title>
    <meta
      name="description"
      content="Catch the Coin by ChennyZEN: a one-life browser arcade game. Collect coins, dodge the bats."
    />
    <meta name="theme-color" content="#10002b" />
    <meta property="og:title" content="Catch the Coin by ChennyZEN" />
    <meta property="og:description" content="Collect coins, dodge the bats. One life only!" />
    <link rel="icon" type="image/png" href="Assets/coin.png" />
    <link rel="stylesheet" href="style.css?v=1.5.0" />
  </head>
  <body>
    <div id="game-wrap">
      <canvas id="game" width="480" height="640"></canvas>

      <button id="btn-pause" class="hidden" aria-label="PAUSE">II</button>

      <!-- MAIN MENU -->
      <div id="screen-menu" class="screen">
        <p class="version">v1.5.0</p>
        <img class="menu-coin" src="Assets/coin.png" alt="" onerror="this.style.display = 'none'" />
        <h1>Catch the Coin</h1>
        <p class="stat">
          <span data-i18n="record">Record</span>: <strong id="menu-record">0</strong>
        </p>
        <div class="modes">
          <button class="btn btn-small mode-btn" data-mode="classic" data-i18n="mode_classic">
            Classic
          </button>
          <button class="btn btn-small mode-btn" data-mode="daily" data-i18n="mode_daily">
            Daily
          </button>
          <button class="btn btn-small mode-btn" data-mode="time" data-i18n="mode_time">
            Time Attack
          </button>
          <button class="btn btn-small mode-btn" data-mode="zen" data-i18n="mode_zen">Zen</button>
        </div>
        <p id="mode-desc" class="mode-desc"></p>
        <button id="btn-start" class="btn btn-primary" data-i18n="start">START</button>
        <div class="menu-grid">
          <button id="btn-skins" class="btn btn-small" data-i18n="customize">CUSTOMIZE</button>
          <button id="btn-stats" class="btn btn-small" data-i18n="stats">STATS</button>
          <button id="btn-howto" class="btn btn-small" data-i18n="how_to">HOW TO PLAY</button>
          <button id="btn-settings" class="btn btn-small" data-i18n="settings">SETTINGS</button>
        </div>
      </div>

      <!-- CUSTOMIZE (SKINS) -->
      <div id="screen-skins" class="screen panel hidden">
        <h2 data-i18n="customize">CUSTOMIZE</h2>
        <p id="skin-total" class="setting-label"></p>
        <div id="skin-list" class="skin-list"></div>
        <button id="btn-skins-back" class="btn btn-primary" data-i18n="back">BACK</button>
      </div>

      <!-- HOW TO PLAY -->
      <div id="screen-howto" class="screen panel hidden">
        <h2 data-i18n="how_to">HOW TO PLAY</h2>
        <div class="list text-list">
          <p data-i18n="htp_move"></p>
          <p data-i18n="htp_coin"></p>
          <p data-i18n="htp_gold"></p>
          <p data-i18n="htp_bat"></p>
          <p data-i18n="htp_shield"></p>
          <p data-i18n="htp_magnet"></p>
          <p data-i18n="htp_slow"></p>
          <p data-i18n="htp_combo"></p>
          <p data-i18n="htp_stage"></p>
          <p data-i18n="htp_modes"></p>
          <p data-i18n="htp_skins"></p>
          <p data-i18n="htp_keys"></p>
        </div>
        <button id="btn-howto-back" class="btn btn-primary" data-i18n="back">BACK</button>
      </div>

      <!-- STATS -->
      <div id="screen-stats" class="screen panel hidden">
        <h2 data-i18n="stats">STATS</h2>
        <div id="stats-list" class="list"></div>
        <button id="btn-stats-back" class="btn btn-primary" data-i18n="back">BACK</button>
      </div>

      <!-- SETTINGS -->
      <div id="screen-settings" class="screen panel hidden">
        <h2 data-i18n="settings">SETTINGS</h2>
        <button id="btn-sound" class="btn btn-small">SOUND: ON</button>
        <div class="volumes">
          <label
            ><span data-i18n="music">Music</span>
            <input class="vol-music" type="range" min="0" max="100" value="50"
          /></label>
          <label
            ><span data-i18n="sfx">SFX</span>
            <input class="vol-sfx" type="range" min="0" max="100" value="100"
          /></label>
        </div>
        <p class="setting-label" data-i18n="language">Language</p>
        <div class="row-buttons">
          <button class="btn btn-small lang-btn" data-lang="en">English</button>
          <button class="btn btn-small lang-btn" data-lang="it">Italiano</button>
        </div>
        <button id="btn-reset" class="btn btn-small" data-i18n="reset">RESET DATA</button>
        <div class="credits-small">
          <p>Graphics: Kenney.nl (CC0)</p>
          <p>Menu music: Crystal Cave (song18) - The Cynic Project / pixelsphere.org (CC0)</p>
          <p>Game music: Enchanted Tiki 86 - cynicmusic.com (CC0)</p>
        </div>
        <button id="btn-settings-back" class="btn btn-primary" data-i18n="back">BACK</button>
      </div>

      <!-- PAUSE -->
      <div id="screen-pause" class="screen hidden">
        <h2 data-i18n="pause">PAUSE</h2>
        <button id="btn-resume" class="btn btn-primary" data-i18n="resume">RESUME</button>
        <button id="btn-pause-menu" class="btn" data-i18n="menu">MENU</button>
        <div class="volumes">
          <label
            ><span data-i18n="music">Music</span>
            <input class="vol-music" type="range" min="0" max="100" value="50"
          /></label>
          <label
            ><span data-i18n="sfx">SFX</span>
            <input class="vol-sfx" type="range" min="0" max="100" value="100"
          /></label>
        </div>
      </div>

      <!-- GAME OVER -->
      <div id="screen-gameover" class="screen hidden">
        <h2 data-i18n="gameover">Game over</h2>
        <p id="over-mode" class="subtitle"></p>
        <p class="stat">
          <span data-i18n="score">Score</span>: <strong id="final-score">0</strong>
        </p>
        <p class="stat">
          <span data-i18n="record">Record</span>: <strong id="final-record">0</strong>
        </p>
        <p id="new-record" class="new-record hidden" data-i18n="new_record">New Record!</p>
        <p id="over-ach" class="over-ach hidden"></p>
        <button id="btn-retry" class="btn btn-primary" data-i18n="restart">RESTART</button>
        <button id="btn-over-menu" class="btn" data-i18n="menu">MENU</button>
      </div>
    </div>

    <script src="game.js?v=1.5.0"></script>
  </body>
</html>
