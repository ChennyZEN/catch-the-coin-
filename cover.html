<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Generatore cover</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #222;
        color: #fff;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      canvas {
        max-width: 100%;
        border: 2px solid #4cc9f0;
      }
      button {
        margin-top: 16px;
        padding: 12px 24px;
        font-size: 18px;
        cursor: pointer;
      }
      p {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <h2>Cover 630 x 500</h2>
    <canvas id="cover" width="630" height="500"></canvas><br />
    <button id="download">Scarica cover.png</button>
    <p id="msg"></p>

    <script>
      const c = document.getElementById("cover");
      const ctx = c.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      const FONT = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';

      function load(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = src;
        });
      }

      // Disegna uno sprite centrato in (cx, cy), alto h, mantenendo le proporzioni
      function sprite(img, cx, cy, h, rot = 0) {
        if (!img) return;
        const w = (h * img.width) / img.height;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
        ctx.restore();
      }
      function glowSprite(img, cx, cy, h, rot, color, blur) {
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = blur;
        sprite(img, cx, cy, h, rot);
        ctx.restore();
      }

      // Scie rosse del pipistrello veloce
      function streaks(cx, cy, h) {
        ctx.save();
        ctx.strokeStyle = "rgba(255, 23, 68, 0.6)";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(cx - h * 0.25, cy - h * 0.95);
        ctx.lineTo(cx - h * 0.25, cy - h * 0.55);
        ctx.moveTo(cx + h * 0.25, cy - h * 0.95);
        ctx.lineTo(cx + h * 0.25, cy - h * 0.55);
        ctx.stroke();
        ctx.restore();
      }

      // Icone dei power-up: shield, magnet, slow
      function powerup(kind, cx, cy, r) {
        const color = kind === "shield" ? "#4cc9f0" : kind === "magnet" ? "#f72585" : "#9d4edd";
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 16;
        ctx.fillStyle = "rgba(16, 0, 43, 0.9)";
        ctx.beginPath();
        ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = color;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#fff";
        ctx.fillStyle = color;
        if (kind === "shield") {
          ctx.beginPath();
          ctx.moveTo(cx, cy - r * 0.55);
          ctx.lineTo(cx + r * 0.5, cy - r * 0.3);
          ctx.lineTo(cx + r * 0.5, cy + r * 0.05);
          ctx.quadraticCurveTo(cx + r * 0.45, cy + r * 0.5, cx, cy + r * 0.65);
          ctx.quadraticCurveTo(cx - r * 0.45, cy + r * 0.5, cx - r * 0.5, cy + r * 0.05);
          ctx.lineTo(cx - r * 0.5, cy - r * 0.3);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        } else if (kind === "magnet") {
          ctx.lineWidth = 6;
          ctx.strokeStyle = color;
          ctx.beginPath();
          ctx.arc(cx, cy - r * 0.05, r * 0.42, Math.PI, 0);
          ctx.lineTo(cx + r * 0.42, cy + r * 0.5);
          ctx.moveTo(cx - r * 0.42, cy - r * 0.05);
          ctx.lineTo(cx - r * 0.42, cy + r * 0.5);
          ctx.stroke();
          ctx.strokeStyle = "#fff";
          ctx.beginPath();
          ctx.moveTo(cx - r * 0.42, cy + r * 0.3);
          ctx.lineTo(cx - r * 0.42, cy + r * 0.5);
          ctx.moveTo(cx + r * 0.42, cy + r * 0.3);
          ctx.lineTo(cx + r * 0.42, cy + r * 0.5);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx, cy - r * 0.38);
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + r * 0.28, cy + r * 0.12);
          ctx.stroke();
        }
        ctx.restore();
      }

      function titleText(text, y, size) {
        ctx.font = "900 " + size + "px " + FONT;
        ctx.textAlign = "center";
        const w = ctx.measureText(text).width;
        const g = ctx.createLinearGradient(315 - w / 2, 0, 315 + w / 2, 0);
        g.addColorStop(0, "#ffd60a");
        g.addColorStop(0.5, "#f72585");
        g.addColorStop(1, "#4cc9f0");
        ctx.lineJoin = "round";
        ctx.lineWidth = 10;
        ctx.strokeStyle = "#10002b";
        ctx.shadowColor = "rgba(247, 37, 133, 0.7)";
        ctx.shadowBlur = 24;
        ctx.strokeText(text, 315, y);
        ctx.shadowBlur = 0;
        ctx.fillStyle = g;
        ctx.fillText(text, 315, y);
      }

      function label(text, y, size, color) {
        ctx.font = "bold " + size + "px " + FONT;
        ctx.textAlign = "center";
        ctx.lineJoin = "round";
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#10002b";
        ctx.strokeText(text, 315, y);
        ctx.fillStyle = color;
        ctx.fillText(text, 315, y);
      }

      function draw(player, coin, bat) {
        // Sfondo
        const bg = ctx.createLinearGradient(0, 0, 0, 500);
        bg.addColorStop(0, "#10002b");
        bg.addColorStop(0.55, "#240046");
        bg.addColorStop(1, "#5a189a");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 630, 500);

        const glow = ctx.createRadialGradient(315, 130, 10, 315, 130, 330);
        glow.addColorStop(0, "rgba(247, 37, 133, 0.35)");
        glow.addColorStop(1, "rgba(247, 37, 133, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, 630, 500);

        // Monete
        sprite(coin, 70, 95, 58, -0.25);
        sprite(coin, 565, 70, 50, 0.2);
        sprite(coin, 95, 300, 64, 0.15);
        sprite(coin, 405, 320, 40, -0.1);
        // Moneta d'oro
        glowSprite(coin, 548, 300, 76, -0.1, "#ffd60a", 24);

        // Pipistrelli: a zig-zag (verde), veloce (rosso) e normale
        glowSprite(bat, 60, 200, 62, 0, "#9bf000", 16);
        streaks(575, 190, 66);
        glowSprite(bat, 575, 190, 66, 0, "#ff1744", 18);
        sprite(bat, 535, 425, 52);

        // Power-up
        powerup("shield", 190, 405, 24);
        powerup("magnet", 440, 430, 24);
        powerup("slow", 85, 420, 24);

        // Personaggio
        sprite(player, 315, 395, 100);

        // Testi
        titleText("CATCH THE", 118, 64);
        titleText("COIN", 210, 100);
        label("by ChennyZEN", 258, 28, "#4cc9f0");
        label("POWER-UPS · 4 MODES · ONE LIFE", 478, 24, "#ffffff");

        if (!player || !coin || !bat) {
          document.getElementById("msg").textContent =
            "Alcune immagini non sono state trovate: controlla che cover.html sia nella cartella principale, accanto ad Assets.";
        }
      }

      Promise.all([
        load("Assets/player.png"),
        load("Assets/coin.png"),
        load("Assets/bat.png")
      ]).then(([player, coin, bat]) => draw(player, coin, bat));

      document.getElementById("download").addEventListener("click", () => {
        try {
          const a = document.createElement("a");
          a.href = c.toDataURL("image/png");
          a.download = "cover.png";
          a.click();
        } catch (e) {
          document.getElementById("msg").textContent =
            "Apri la pagina con Live Server (non con doppio clic sul file) per poter scaricare l'immagine.";
        }
      });
    </script>
  </body>
</html>
